[package]
name = "sms"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "sms-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "signal"] }
async-channel = "=2.5.0"
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "script"] }

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["test-util"] } # start_paused: virtual time
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = "thin"
